<svg width="1320" height="760" viewBox="0 0 1320 760" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1320" height="760" rx="36" fill="#F8FAFC"/>
  <defs>
    <linearGradient id="bg" x1="70" y1="80" x2="1240" y2="690" gradientUnits="userSpaceOnUse">
      <stop stop-color="#EEF6FF"/>
      <stop offset="0.52" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F0FDF4"/>
    </linearGradient>
    <linearGradient id="steer" x1="172" y1="206" x2="1148" y2="598" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2563EB"/>
      <stop offset="0.5" stop-color="#7C3AED"/>
      <stop offset="1" stop-color="#22C55E"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect x="54" y="54" width="1212" height="652" rx="32" fill="url(#bg)" stroke="#D8E0EA" stroke-width="2"/>
  <text x="90" y="118" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="850" fill="#0F172A">Steering, System Prompt, Skill</text>
  <text x="90" y="157" font-family="Inter, Arial, sans-serif" font-size="18" fill="#64748B">Three layers of constraints that shape an AI agent's behavior</text>

  <g filter="url(#shadow)" font-family="Inter, Arial, sans-serif">
    <rect x="154" y="198" width="1012" height="382" rx="34" fill="url(#steer)" fill-opacity="0.12" stroke="#7C3AED" stroke-width="2"/>
    <text x="202" y="252" font-size="30" font-weight="850" fill="#312E81">Steering</text>
    <text x="202" y="288" font-size="17" fill="#475569">All mechanisms that guide behavior, decisions, style, tool use, and workflow direction</text>

    <rect x="244" y="334" width="380" height="170" rx="28" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="2"/>
    <text x="286" y="392" font-size="28" font-weight="850" fill="#1D4ED8">System Prompt</text>
    <text x="286" y="430" font-size="16" fill="#475569">Global rules and boundaries</text>
    <text x="286" y="460" font-size="16" fill="#475569">Role, safety, style, tool policy</text>

    <rect x="696" y="334" width="380" height="170" rx="28" fill="#FFFFFF" stroke="#BBF7D0" stroke-width="2"/>
    <text x="738" y="392" font-size="28" font-weight="850" fill="#16A34A">Skill</text>
    <text x="738" y="430" font-size="16" fill="#475569">Task-specific operating guide</text>
    <text x="738" y="460" font-size="16" fill="#475569">Steps, tools, checks, output format</text>
  </g>

  <rect x="172" y="616" width="976" height="62" rx="20" fill="#0F172A"/>
  <text x="218" y="655" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="750" fill="#F8FAFC">System prompt defines how the agent should behave globally. Skill defines how it should complete a specific task. Steering is the umbrella concept.</text>
</svg>
