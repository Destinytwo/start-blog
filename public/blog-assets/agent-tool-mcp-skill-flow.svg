<svg width="1320" height="760" viewBox="0 0 1320 760" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1320" height="760" rx="36" fill="#08111F"/>
  <defs>
    <linearGradient id="panel" x1="68" y1="78" x2="1250" y2="700" gradientUnits="userSpaceOnUse">
      <stop stop-color="#10223B"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="route" x1="180" y1="0" x2="1120" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38BDF8"/>
      <stop offset="0.5" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#34D399"/>
    </linearGradient>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2 2L10 6L2 10" fill="none" stroke="#E2E8F0" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="54" y="54" width="1212" height="652" rx="32" fill="url(#panel)" stroke="#1E3A5F" stroke-width="2"/>
  <text x="90" y="120" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="850" fill="#F8FAFC">Tool, MCP, Agent, Skill</text>
  <text x="90" y="158" font-family="Inter, Arial, sans-serif" font-size="18" fill="#CBD5E1">How external capabilities become controllable multi-step agent behavior</text>

  <g font-family="Inter, Arial, sans-serif">
    <rect x="100" y="250" width="190" height="132" rx="24" fill="#0B2138" stroke="#38BDF8" stroke-width="2"/>
    <text x="136" y="302" font-size="24" font-weight="850" fill="#F8FAFC">User Task</text>
    <text x="136" y="336" font-size="15" fill="#BAE6FD">intent + constraints</text>

    <rect x="360" y="250" width="190" height="132" rx="24" fill="#161B33" stroke="#A78BFA" stroke-width="2"/>
    <text x="396" y="302" font-size="24" font-weight="850" fill="#F8FAFC">Agent</text>
    <text x="396" y="336" font-size="15" fill="#DDD6FE">plan, choose, iterate</text>

    <rect x="620" y="250" width="190" height="132" rx="24" fill="#1A2332" stroke="#FACC15" stroke-width="2"/>
    <text x="656" y="302" font-size="24" font-weight="850" fill="#F8FAFC">MCP</text>
    <text x="656" y="336" font-size="15" fill="#FEF3C7">standard tool bridge</text>

    <rect x="880" y="250" width="190" height="132" rx="24" fill="#0D241B" stroke="#34D399" stroke-width="2"/>
    <text x="916" y="302" font-size="24" font-weight="850" fill="#F8FAFC">Tools</text>
    <text x="916" y="336" font-size="15" fill="#BBF7D0">API, file, search, DB</text>

    <rect x="465" y="510" width="390" height="102" rx="24" fill="#0F172A" stroke="#60A5FA"/>
    <text x="506" y="550" font-size="23" font-weight="850" fill="#F8FAFC">Agent Skill</text>
    <text x="506" y="584" font-size="15" fill="#CBD5E1">structured operating guide: when to use, steps, rules, output format</text>
  </g>

  <path d="M290 316H352" stroke="url(#route)" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M550 316H612" stroke="url(#route)" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M810 316H872" stroke="url(#route)" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M976 382C976 468 808 503 696 511" stroke="#60A5FA" stroke-width="4" stroke-linecap="round" stroke-dasharray="9 10" marker-end="url(#arrow)"/>
  <path d="M624 510C520 486 455 438 455 390" stroke="#A78BFA" stroke-width="4" stroke-linecap="round" stroke-dasharray="9 10" marker-end="url(#arrow)"/>

  <rect x="122" y="432" width="1076" height="44" rx="14" fill="#FFFFFF" fill-opacity="0.06"/>
  <text x="154" y="461" font-family="Inter, Arial, sans-serif" font-size="16" fill="#E2E8F0">The model does not execute tools itself. The platform executes tool calls, returns results, and the agent decides the next action.</text>
</svg>
